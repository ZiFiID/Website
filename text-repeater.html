<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO — Text Repeater</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080810;
    --surface: #0f0f1e;
    --card: #13131f;
    --border: #1e1e3a;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #f59e0b;
    --glow: rgba(124, 58, 237, 0.4);
    --glow2: rgba(6, 182, 212, 0.3);
    --text: #e2e8f0;
    --muted: #64748b;
    --white: #ffffff;
  }

  html { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124,58,237,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6,182,212,0.1) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 50% 50%, rgba(245,158,11,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Grid overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 24px 100px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 60px;
    animation: fadeDown 0.8s ease both;
  }

  .logo-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 12px;
  }

  .logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 30px var(--glow);
    animation: pulse-glow 3s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 30px var(--glow); }
    50% { box-shadow: 0 0 60px var(--glow), 0 0 100px rgba(6,182,212,0.2); }
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 12vw, 88px);
    letter-spacing: 8px;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 50%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    filter: drop-shadow(0 0 30px rgba(124,58,237,0.5));
  }

  .tagline {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 10px;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.9s 0.2s ease both;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }

  .inputs-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: start;
    margin-bottom: 28px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent2);
    text-transform: uppercase;
  }

  input[type="text"], input[type="number"], textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--white);
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    width: 100%;
  }

  textarea {
    resize: vertical;
    min-height: 52px;
    max-height: 160px;
    line-height: 1.5;
    font-family: 'Space Mono', monospace;
  }

  input[type="text"]::placeholder, textarea::placeholder {
    color: #2d2d4a;
  }

  input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.15), 0 0 20px rgba(124,58,237,0.1);
    background: #0d0d1c;
  }

  input[type="number"] {
    width: 110px;
    text-align: center;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button { display: none; }

  .num-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .num-wrap {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .num-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
  }

  .num-btn {
    background: var(--surface);
    border: none;
    color: var(--accent2);
    font-size: 20px;
    width: 44px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: 'Space Mono', monospace;
    flex-shrink: 0;
  }

  .num-btn:hover { background: #1a1a30; color: var(--white); }
  .num-btn:active { background: var(--accent); color: var(--white); }

  /* Hint under textarea for whitespace-only content */
  .input-hint {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-top: 6px;
    min-height: 12px;
    transition: color 0.3s;
  }

  .input-hint.notice { color: var(--accent3); }

  /* Separator option */
  .separator-row {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .sep-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .sep-btn:hover { border-color: var(--accent); color: var(--text); }
  .sep-btn.active {
    background: rgba(124,58,237,0.15);
    border-color: var(--accent);
    color: var(--white);
    box-shadow: 0 0 10px rgba(124,58,237,0.2);
  }

  /* Generate button */
  .btn-generate {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent), #5b21b6);
    border: none;
    border-radius: 14px;
    color: var(--white);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 30px rgba(124,58,237,0.4);
  }

  .btn-generate::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .btn-generate:hover::before { transform: translateX(100%); }
  .btn-generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(124,58,237,0.6);
  }
  .btn-generate:active { transform: translateY(0); }

  /* Output section */
  .output-section {
    margin-top: 32px;
    animation: fadeUp 0.5s ease both;
    display: none;
  }

  .output-section.visible { display: block; }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .output-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent2);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-badge {
    background: rgba(6,182,212,0.15);
    border: 1px solid rgba(6,182,212,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 10px;
    color: var(--accent2);
  }

  .copy-btn {
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 8px;
    color: var(--accent3);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .copy-btn:hover {
    background: rgba(245,158,11,0.2);
    border-color: var(--accent3);
    box-shadow: 0 0 15px rgba(245,158,11,0.2);
  }

  .copy-btn.copied {
    background: rgba(16,185,129,0.15);
    border-color: #10b981;
    color: #10b981;
  }

  .output-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    color: var(--white);
    word-break: break-all;
    line-height: 1.8;
    max-height: 280px;
    overflow-y: auto;
    position: relative;
    transition: border-color 0.3s;
    white-space: pre-wrap;
  }

  .output-box:hover { border-color: rgba(124,58,237,0.4); }

  /* scrollbar */
  .output-box::-webkit-scrollbar { width: 4px; }
  .output-box::-webkit-scrollbar-track { background: transparent; }
  .output-box::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

  /* Character rainbow effect */
  .char-span {
    display: inline;
    transition: color 0.3s;
  }

  /* Visible marker for whitespace-only characters in output */
  .ws-marker {
    opacity: 0.55;
    font-size: 0.85em;
  }

  /* Echo visualizer */
  .echo-vis {
    margin-top: 24px;
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 48px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .echo-bar {
    width: 6px;
    background: linear-gradient(to top, var(--accent), var(--accent2));
    border-radius: 3px;
    animation: echo-wave 1s ease-in-out infinite;
    transform-origin: bottom;
  }

  @keyframes echo-wave {
    0%, 100% { transform: scaleY(0.3); opacity: 0.4; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    padding: 14px 20px;
    background: rgba(124,58,237,0.05);
    border: 1px solid rgba(124,58,237,0.1);
    border-radius: 10px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--white);
    line-height: 1;
  }

  .stat-key {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Decorative floating dots */
  .dot {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    animation: float-dot linear infinite;
    opacity: 0;
  }

  @keyframes float-dot {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Shake on generate */
  @keyframes shake-gen {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .shake { animation: shake-gen 0.4s ease; }

  /* Custom separator */
  .custom-sep-wrap {
    margin-bottom: 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .custom-sep-inner {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
    background: var(--surface);
  }

  .custom-sep-inner:focus-within {
    border-color: var(--accent3);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
  }

  .custom-sep-inner.active-custom {
    border-color: var(--accent3);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.15), 0 0 20px rgba(245,158,11,0.1);
  }

  .custom-sep-icon {
    padding: 0 12px;
    font-size: 14px;
    flex-shrink: 0;
  }

  .custom-sep-inner input[type="text"] {
    background: transparent;
    border: none;
    border-radius: 0;
    font-size: 14px;
    padding: 12px 8px;
    flex: 1;
    box-shadow: none !important;
  }

  .custom-sep-inner input[type="text"]:focus {
    border: none;
    box-shadow: none !important;
    background: transparent;
  }

  .custom-sep-apply {
    background: rgba(245,158,11,0.15);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--accent3);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 0 18px;
    height: 100%;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    text-transform: uppercase;
    white-space: nowrap;
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .custom-sep-apply:hover {
    background: rgba(245,158,11,0.25);
    color: var(--white);
  }

  .custom-sep-apply.applied {
    background: rgba(16,185,129,0.15);
    color: #10b981;
  }

  .custom-sep-hint {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--muted);
    padding-left: 4px;
    transition: color 0.3s;
  }

  .custom-sep-hint.active { color: var(--accent3); }

  @media (max-width: 500px) {
    .inputs-row { grid-template-columns: 1fr; }
    .num-wrap { width: 100%; }
    input[type="number"] { width: 100%; }
  }
</style>
</head>
<body>

<!-- Floating dots bg -->
<div id="dots-container"></div>

<div class="container">
  <header class="header">
    <div class="logo-line">
      <div class="logo-icon">🔁</div>
    </div>
    <h1>ECHO</h1>
    <p class="tagline">Text Repeater ∙ Amplify Your Words</p>
  </header>

  <div class="card" id="card">
    <!-- Text input -->
    <div class="inputs-row">
      <div class="field">
        <label>Your text</label>
        <textarea id="textInput" placeholder="Type something..." maxlength="500" rows="1"></textarea>
        <div class="input-hint" id="inputHint"></div>
      </div>
      <div class="num-field">
        <label>Repeat</label>
        <div class="num-wrap">
          <button class="num-btn" onclick="adjustNum(-1)">−</button>
          <input type="number" id="numInput" value="3" min="1" />
          <button class="num-btn" onclick="adjustNum(1)">+</button>
        </div>
      </div>
    </div>

    <!-- Separator options -->
    <div style="margin-bottom:10px;">
      <label>Separator</label>
    </div>
    <div class="separator-row">
      <button class="sep-btn active" data-sep="" onclick="setSepPreset(this, '')">None</button>
      <button class="sep-btn" data-sep=" " onclick="setSepPreset(this, ' ')">Space</button>
      <button class="sep-btn" data-sep=", " onclick="setSepPreset(this, ', ')">Comma</button>
      <button class="sep-btn" data-sep="\n" onclick="setSepPreset(this, '\n')">New Line</button>
      <button class="sep-btn" data-sep=" | " onclick="setSepPreset(this, ' | ')">Pipe |</button>
      <button class="sep-btn" data-sep=" — " onclick="setSepPreset(this, ' — ')">Dash —</button>
    </div>
    <!-- Custom separator input -->
    <div class="custom-sep-wrap">
      <div class="custom-sep-inner">
        <span class="custom-sep-icon">✏️</span>
        <input type="text" id="customSepInput" placeholder='Custom separator... e.g. " → " or "***"' maxlength="20" autocomplete="off" />
        <button class="custom-sep-apply" onclick="applyCustomSep()">Apply</button>
      </div>
      <div class="custom-sep-hint" id="customSepHint">Type anything and hit Apply — or press Enter</div>
    </div>

    <!-- Generate button -->
    <button class="btn-generate" onclick="generate()">⚡ GENERATE ⚡</button>

    <!-- Output -->
    <div class="output-section" id="outputSection">
      <div class="output-header">
        <div class="output-label">
          Output
          <span class="count-badge" id="countBadge">0 chars</span>
        </div>
        <button class="copy-btn" id="copyBtn" onclick="copyText()">⧉ Copy</button>
      </div>
      <div class="output-box" id="outputBox"></div>

      <!-- Stats -->
      <div class="stats" id="statsBar">
        <div class="stat">
          <div class="stat-val" id="statChars">0</div>
          <div class="stat-key">Characters</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="statRepeat">0</div>
          <div class="stat-key">Repeats</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="statWords">0</div>
          <div class="stat-key">Words</div>
        </div>
      </div>

      <!-- Echo visualizer -->
      <div class="echo-vis" id="echoVis"></div>
    </div>
  </div>
</div>

<script>
  let currentSep = '';
  let usingCustom = false;

  // Floating dots
  function spawnDot() {
    const dot = document.createElement('div');
    dot.classList.add('dot');
    const size = Math.random() * 6 + 3;
    const colors = ['#7c3aed','#06b6d4','#f59e0b','#a78bfa','#67e8f9'];
    dot.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*12+8}s;
      animation-delay:${Math.random()*5}s;
    `;
    document.getElementById('dots-container').appendChild(dot);
    setTimeout(() => dot.remove(), 20000);
  }
  setInterval(spawnDot, 800);

  function setSepPreset(btn, val) {
    currentSep = val;
    usingCustom = false;
    document.querySelectorAll('.sep-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // clear custom state
    document.getElementById('customSepInput').value = '';
    document.querySelector('.custom-sep-inner').classList.remove('active-custom');
    document.querySelector('.custom-sep-apply').classList.remove('applied');
    document.getElementById('customSepHint').textContent = 'Type anything and hit Apply — or press Enter';
    document.getElementById('customSepHint').classList.remove('active');
  }

  function applyCustomSep() {
    const raw = document.getElementById('customSepInput').value;
    // Support escape sequences: \n \t
    currentSep = raw.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
    usingCustom = true;
    // Deactivate preset buttons
    document.querySelectorAll('.sep-btn').forEach(b => b.classList.remove('active'));
    // Visual feedback
    const inner = document.querySelector('.custom-sep-inner');
    const applyBtn = document.querySelector('.custom-sep-apply');
    const hint = document.getElementById('customSepHint');
    inner.classList.add('active-custom');
    applyBtn.classList.add('applied');
    applyBtn.textContent = '✓ Set!';
    const preview = raw === '' ? '(none)' : raw === '\\n' ? '(new line)' : raw === '\\t' ? '(tab)' : `"${raw}"`;
    hint.textContent = `Active custom separator: ${preview}`;
    hint.classList.add('active');
    setTimeout(() => {
      applyBtn.textContent = 'Apply';
      applyBtn.classList.remove('applied');
    }, 1500);
  }

  function adjustNum(delta) {
    const inp = document.getElementById('numInput');
    let val = parseInt(inp.value) || 1;
    val = Math.max(1, val + delta);
    inp.value = val;
    inp.style.color = '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
    setTimeout(() => inp.style.color = '', 300);
  }

  // Auto-grow the textarea as the user types (including across line breaks)
  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function generate() {
    const textEl = document.getElementById('textInput');
    const text = textEl.value;
    const num = Math.max(1, parseInt(document.getElementById('numInput').value) || 1);
    const hint = document.getElementById('inputHint');

    // Only reject truly EMPTY input (length 0). Whitespace-only content
    // (a single space, multiple spaces, a newline, tabs, etc.) is valid
    // and should be repeated as-is — that's the whole point of a repeater.
    if (text.length === 0) {
      textEl.style.borderColor = '#ef4444';
      textEl.style.boxShadow = '0 0 0 3px rgba(239,68,68,0.2)';
      const originalPlaceholder = textEl.placeholder;
      textEl.placeholder = 'Please type something first! 👀';
      hint.textContent = '';
      hint.classList.remove('notice');
      setTimeout(() => {
        textEl.style.borderColor = '';
        textEl.style.boxShadow = '';
        textEl.placeholder = originalPlaceholder;
      }, 1500);
      return;
    }

    // Friendly (non-blocking) notice when the input is whitespace-only,
    // just so the user knows it registered as spaces/newlines/tabs.
    if (text.trim().length === 0) {
      const desc = describeWhitespace(text);
      hint.textContent = `Repeating whitespace: ${desc}`;
      hint.classList.add('notice');
    } else {
      hint.textContent = '';
      hint.classList.remove('notice');
    }

    // Card shake
    const card = document.getElementById('card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');

    const sep = currentSep;

    // Threshold above which per-repeat rainbow spans become the
    // bottleneck (thousands of individual <span> elements + repeated
    // escHtml() calls). Below it, keep the full colored breakdown —
    // it's cheap and looks good. Above it, build the string natively
    // (Array.join is implemented in C++ in the engine, not a JS loop)
    // and escape once at the end instead of once per repeat.
    const RAINBOW_LIMIT = 300;

    let result;
    const outputBox = document.getElementById('outputBox');

    if (num <= RAINBOW_LIMIT) {
      const parts = Array(num).fill(text);
      result = parts.join(sep);

      const colors = ['#a78bfa','#67e8f9','#fcd34d','#6ee7b7','#f9a8d4','#93c5fd'];
      let html = '';
      parts.forEach((p, i) => {
        const c = colors[i % colors.length];
        html += `<span style="color:${c}">${escHtml(p)}</span>`;
        if (i < parts.length - 1) {
          html += `<span style="color:#475569">${escHtml(sep)}</span>`;
        }
      });
      outputBox.innerHTML = html;
    } else {
      // Fast path: one native join instead of a manual loop building
      // up a string with += (which reallocates on every iteration),
      // and one escape pass over the whole result instead of one
      // escHtml() call per repeated chunk.
      result = Array(num).fill(text).join(sep);

      // The full `result` (used for stats and copy) is untouched, but
      // what gets painted to the DOM is capped separately. The cost
      // here isn't string length — 100k copies of "A" render as one
      // long wrapped line and are cheap. It's *line count*: with
      // white-space: pre-wrap, every \n becomes its own layout line,
      // so 100k newlines means 100k lines the browser must lay out
      // and account for in a scrollable box — that's what freezes.
      // Cap the number of rendered lines while keeping the full text
      // available via Copy.
      const MAX_RENDERED_LINES = 2000;
      const lines = result.split('\n');
      if (lines.length > MAX_RENDERED_LINES) {
        const shown = lines.slice(0, MAX_RENDERED_LINES).join('\n');
        const omitted = lines.length - MAX_RENDERED_LINES;
        outputBox.textContent = shown +
          `\n… (${omitted.toLocaleString()} more line${omitted === 1 ? '' : 's'} — use Copy to get the full text)`;
      } else {
        outputBox.textContent = result;
      }
    }

    // Stats
    document.getElementById('statChars').textContent = result.length.toLocaleString();
    document.getElementById('statRepeat').textContent = num;
    // Word count via regex match instead of split+filter — avoids
    // building a huge intermediate array for very long results.
    const wordMatches = result.match(/\S+/g);
    document.getElementById('statWords').textContent = (wordMatches ? wordMatches.length : 0).toLocaleString();
    document.getElementById('countBadge').textContent = result.length.toLocaleString() + ' chars';

    // Visualizer bars
    const vis = document.getElementById('echoVis');
    vis.innerHTML = '';
    const barCount = Math.min(num, 60);
    for (let i = 0; i < barCount; i++) {
      const bar = document.createElement('div');
      bar.className = 'echo-bar';
      bar.style.height = (Math.random() * 32 + 8) + 'px';
      bar.style.animationDelay = (i * 0.05) + 's';
      bar.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
      vis.appendChild(bar);
    }

    // Show output
    const section = document.getElementById('outputSection');
    section.classList.remove('visible');
    void section.offsetWidth;
    section.classList.add('visible');

    // Reset copy button
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.textContent = '⧉ Copy';
    copyBtn.classList.remove('copied');
    copyBtn._result = result;
  }

  // Turns a whitespace-only string into a short human-readable description,
  // e.g. "3 spaces", "1 newline", "2 spaces + 1 tab"
  function describeWhitespace(str) {
    if (str.length === 0) return '(empty)';
    const spaces = (str.match(/ /g) || []).length;
    const newlines = (str.match(/\n/g) || []).length;
    const tabs = (str.match(/\t/g) || []).length;
    const parts = [];
    if (spaces) parts.push(`${spaces} space${spaces > 1 ? 's' : ''}`);
    if (newlines) parts.push(`${newlines} line break${newlines > 1 ? 's' : ''}`);
    if (tabs) parts.push(`${tabs} tab${tabs > 1 ? 's' : ''}`);
    return parts.length ? parts.join(' + ') : `${str.length} whitespace char(s)`;
  }

  // Escapes HTML for the colored output, then renders spaces/newlines/tabs
  // as visible marks so a whitespace-only repeat isn't just an empty box.
  function escHtml(str) {
    let out = str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
    // Replace char-by-char (not with regex+replace chaining) so the
    // spaces inside the marker spans we just inserted never get
    // re-matched by a later replace pass.
    out = out
      .split('')
      .map(ch => {
        if (ch === '\n') return '<span class="ws-marker">↵</span><br>';
        if (ch === '\t') return '<span class="ws-marker">⇥</span>\t';
        if (ch === ' ') return '<span class="ws-marker">·</span> ';
        return ch;
      })
      .join('');
    return out;
  }

  function copyText() {
    const btn = document.getElementById('copyBtn');
    const text = btn._result || '';
    // Whitespace-only results are still valid to copy — only bail on a
    // truly empty/undefined result (e.g. before Generate has run once).
    if (text.length === 0) return;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '⧉ Copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // Enter key: Shift+Enter (or Enter alone, since it's a textarea now)
  // still inserts a newline normally; Ctrl/Cmd+Enter triggers Generate
  // as a convenient shortcut without blocking manual newline entry.
  document.getElementById('textInput').addEventListener('keydown', e => {
    if ((e.key === 'Enter') && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      generate();
    }
  });
  document.getElementById('numInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') generate();
  });
  document.getElementById('customSepInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') applyCustomSep();
  });

  // Live preview pulse + auto-grow
  const textInputEl = document.getElementById('textInput');
  textInputEl.addEventListener('input', () => {
    autoGrow(textInputEl);
    textInputEl.style.borderColor = 'rgba(124,58,237,0.6)';
    clearTimeout(window._pt);
    window._pt = setTimeout(() => textInputEl.style.borderColor = '', 600);
  });
  autoGrow(textInputEl);
</script>
</body>
</html>
